name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: support_app
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: support_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support_app -d support_assistant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://support_app:ci-only-password@localhost:5432/support_assistant_test
      TEST_DATABASE_URL: postgresql://support_app:ci-only-password@localhost:5432/support_assistant_test
      DOCUMENT_STORAGE_ROOT: var/documents
      OPENROUTER_API_KEY: ci-placeholder
      OPENROUTER_MODEL: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run lint
      - run: npm run build
